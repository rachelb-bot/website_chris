<html><head><!--FONTS--><style>/* Off 80 Electric
   Palette lifted from the Northern Spark badge: Sierra night sky, rust ring,
   tan lettering, snow on the peaks. Rust is the action color. */
:root {
  --paper: #F0EDE5;
  --paper-2: #E4DFD2;
  --ink: #1A2A2A;
  --ink-soft: #4B5957;
  --night: #16302F;
  --night-2: #1F403E;
  --night-deep: #0F2423;
  --night-line: #355856;
  --on-night: #F2EBDA;
  --on-night-soft: #AFBDB6;
  --tan: #E7CF97;
  --tan-deep: #C9A85C;
  --rust: #B9481F;
  --rust-deep: #973A16;
  --snow: #D8E3E2;
  --rule: #D5CEBF;
  --f-slab: 'Alfa Slab One', 'Rockwell', 'Roboto Slab', Georgia, serif;
  --f-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Type scale, ratio ~1.25 off an 18px base */
  --t-sm: 0.889rem;
  --t-base: 1.125rem;
  --t-md: 1.333rem;
  --t-lg: 1.666rem;
  --t-xl: clamp(1.9rem, 1.4rem + 1.6vw, 2.6rem);
  --t-xxl: clamp(2.6rem, 1.4rem + 4.6vw, 5.4rem);

  --gutter: clamp(1rem, 0.5rem + 2.5vw, 2.5rem);
  --measure: 68ch;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--t-base)/1.6 var(--f-body);
  font-variation-settings: 'wdth' 100;
  overflow-x: hidden;
}
img, svg { max-width: 100%; }
a { color: var(--rust-deep); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { color: var(--rust); text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-variation-settings: 'wdth' 112; line-height: 1.1; margin: 0 0 0.6em; letter-spacing: -0.01em; text-wrap: balance; }
h1, h2 { font-family: var(--f-slab); font-weight: 400; letter-spacing: 0; font-variation-settings: normal; }
h2 { font-size: var(--t-xl); line-height: 1.12; }
.section > .wrap > h2, .section-head h2 { color: var(--night); }
h3 { font-size: var(--t-md); font-weight: 700; }
p { margin: 0 0 1em; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }
.wrap-wide { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: calc(var(--measure) + 2 * var(--gutter)); }
.skip { position: absolute; left: -999px; top: 0; background: var(--tan); color: var(--ink); padding: 0.6rem 1rem; z-index: 100; }
.skip:focus { left: 0.5rem; top: 0.5rem; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  font: 700 1rem/1 var(--f-display); font-variation-settings: 'wdth' 105;
  padding: 0.85em 1.25em; border-radius: var(--radius); border: 2px solid transparent;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn-lg { font-size: 1.125rem; padding: 1em 1.4em; }
.btn-call { background: var(--rust); color: #fff; border-color: var(--rust); }
.btn-call:hover { background: var(--rust-deep); border-color: var(--rust-deep); color: #fff; text-decoration: none; }
.btn-ghost { color: var(--on-night); border-color: var(--on-night-soft); background: transparent; }
.btn-ghost:hover { border-color: var(--on-night); color: #fff; }
.btn-ghost-dark { color: var(--ink); border-color: var(--ink); background: var(--paper); }

/* ── Top bar + header ── */
.topbar { background: var(--night); color: var(--on-night-soft); font-size: var(--t-sm); }
.topbar-in { display: flex; justify-content: space-between; gap: 1rem; padding-top: 0.4rem; padding-bottom: 0.4rem; }
.site-header { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
.header-in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 72px; }
.logo { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); }
.logo:hover { color: var(--ink); }
.logo-mark { width: 48px; height: 48px; flex: none; }
.logo-word { display: flex; flex-direction: column; line-height: 0.95; text-transform: uppercase; }
.logo-off { font: 400 1.55rem/1 var(--f-slab); letter-spacing: 0.02em; }
.logo-elec { font: 700 0.74rem/1 var(--f-display); font-variation-settings: 'wdth' 125; letter-spacing: 0.3em; color: var(--rust); margin-top: 0.2rem; }
.footer-badge { width: 132px; height: 132px; display: block; margin-bottom: 1.25rem; }
.site-nav { display: flex; align-items: center; gap: 1.5rem; }
.site-nav ul { list-style: none; display: flex; gap: 1.4rem; margin: 0; padding: 0; }
.site-nav ul a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1rem; padding: 0.4rem 0; border-bottom: 2px solid transparent; }
.site-nav ul a:hover, .site-nav ul a[aria-current] { border-bottom-color: var(--rust); }
.nav-toggle { display: none; font: 700 1rem var(--f-display); background: none; border: 2px solid var(--ink); border-radius: var(--radius); padding: 0.5rem 0.9rem; color: var(--ink); }

@media (max-width: 960px) {
  .topbar-hours { display: none; }
  .js .nav-toggle { display: inline-block; }
  .js .site-nav { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--paper); border-bottom: 1px solid var(--rule); flex-direction: column; align-items: stretch; padding: 0.5rem var(--gutter) 1.25rem; }
  .js .site-nav.open { display: flex; }
  .site-nav ul { flex-direction: column; gap: 0; }
  .site-nav ul a { display: block; padding: 0.8rem 0; border-bottom: 1px solid var(--rule); }
  .site-nav .btn { margin-top: 1rem; }
  .site-nav:not(.open) { flex-wrap: wrap; }
}

/* ── Breadcrumbs ── */
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.9rem 0 0; margin: 0; font-size: var(--t-sm); color: var(--ink-soft); }
.crumbs li + li::before { content: '/'; margin-right: 0.4rem; color: var(--rule); }
.crumbs a { color: var(--ink-soft); }
.crumbs + main .hero { margin-top: 0.9rem; }

/* ── Hero ── */
.hero { background: linear-gradient(180deg, var(--night-deep) 0%, var(--night) 70%); color: var(--on-night); border-bottom: 7px solid var(--rust); box-shadow: inset 0 -3px 0 var(--tan); padding: clamp(2.5rem, 6vw, 5rem) 0 clamp(2.5rem, 5vw, 4rem); position: relative; overflow: hidden; }
.hero a:not(.btn) { color: var(--tan); }
.hero-home { padding-bottom: 0; }
.hero-home .route-caption { padding-bottom: 2.5rem; }
.hero h1 { color: var(--on-night); }
.h1-big { display: block; font: 400 var(--t-xxl)/1 var(--f-slab); color: var(--tan); letter-spacing: 0.005em; max-width: 14ch; text-shadow: 0 2px 0 var(--night-deep); }
.h1-sub { display: block; margin-top: 1.1rem; font: 400 var(--t-md)/1.45 var(--f-body); font-variation-settings: 'wdth' 100; color: var(--on-night-soft); max-width: 46ch; letter-spacing: 0; }
.hero-inner h1 { font: 400 clamp(2.2rem, 1.3rem + 3.2vw, 4rem)/1.05 var(--f-slab); color: var(--tan); max-width: 20ch; margin-bottom: 0.5em; text-wrap: balance; }
.hero-answer { font-size: var(--t-md); line-height: 1.5; max-width: 60ch; color: var(--on-night); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }
.hero-route { margin-top: clamp(2rem, 4vw, 3rem); }
.route-caption { color: var(--on-night-soft); max-width: 62ch; font-size: var(--t-sm); margin: 0.75rem 0 0; padding-left: calc(96 / 1200 * 100%); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 2.25rem 0 0; border-top: 1px solid var(--night-line); }
.facts div { padding: 0.9rem 1rem 0.2rem 0; }
.facts dt { font-size: var(--t-sm); color: var(--on-night-soft); }
.facts dd { margin: 0.15rem 0 0; font: 700 1.1rem/1.3 var(--f-display); font-variation-settings: 'wdth' 110; }

/* ── Route profile: the signature element ── */
.route-profile { position: relative; }
.rp-svg { display: block; width: 100%; height: auto; overflow: visible; }
.rp-grid { stroke: var(--night-line); stroke-width: 1; stroke-dasharray: 2 6; }
.rp-axis { fill: var(--on-night-soft); font: 400 13px var(--f-body); font-variant-numeric: tabular-nums; }
.rp-stars { fill: var(--on-night); opacity: 0.55; }
.rp-far { fill: var(--night-2); }
.rp-snow { fill: var(--snow); opacity: 0.32; }
.rp-ground { fill: var(--night-deep); }
.rp-grid { opacity: 0.6; }
.rp-wire { fill: none; stroke: var(--tan); stroke-width: 5; stroke-linecap: round; }
.rp-spur { fill: none; stroke: var(--tan); stroke-width: 3; stroke-dasharray: 0.012 0.01; stroke-linecap: round; opacity: 0.85; }
.rp-road { fill: var(--on-night-soft); font: 700 13px var(--f-display); font-variation-settings: 'wdth' 125; letter-spacing: 0.06em; }
.rp-stop { cursor: pointer; text-decoration: none; }
.rp-dot { fill: var(--night); stroke: var(--tan); stroke-width: 3; transition: r 0.15s; }
.rp-halo { fill: none; stroke: var(--tan); stroke-width: 1.5; opacity: 0.6; }
.rp-name, .rp-elev, .rp-road { paint-order: stroke; stroke: var(--night-deep); stroke-width: 6px; stroke-linejoin: round; }
.rp-name { fill: var(--on-night); font: 700 16px var(--f-display); font-variation-settings: 'wdth' 108; }
.rp-elev { fill: var(--on-night-soft); font: 400 13px var(--f-body); }
.rp-stop.is-home .rp-dot { fill: var(--rust); stroke: var(--tan); }
.rp-stop.is-current .rp-dot { fill: var(--tan); }
.rp-halo { stroke: var(--rust); stroke-width: 2.5; opacity: 0.9; }
.rp-stop.is-home .rp-name { font-size: 19px; font-weight: 800; }
.rp-stop.is-current .rp-name { fill: var(--tan); }
.rp-stop:hover .rp-name, .rp-stop:focus-visible .rp-name { fill: var(--tan); text-decoration: underline; }
.rp-stop:hover .rp-dot { r: 9; }
.rp-stop:focus-visible { outline: none; }
.rp-stop:focus-visible .rp-dot { stroke: #fff; stroke-width: 4; }

/* One orchestrated load moment: the wire draws itself up the hill, stops light in order */
@media (prefers-reduced-motion: no-preference) {
  .rp-animate .rp-wire { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.55,.1,.3,1) 0.2s forwards; }
  .rp-animate .rp-spur { opacity: 0; animation: fadein 0.6s ease 1.6s forwards; }
  .rp-animate .rp-stop { opacity: 0; animation: fadein 0.35s ease forwards; animation-delay: calc(0.25s + var(--i) * 0.16s); }
  .rp-animate .rp-halo { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out 2s 2; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }

.rp-list { display: none; }
@media (max-width: 760px) {
  .rp-svg { display: none; }
  .route-caption { padding-left: 0; }
  .rp-list { display: block; list-style: none; margin: 0; padding: 0 0 0 1.75rem; position: relative; }
  .rp-list::before { content: ''; position: absolute; left: 0.55rem; top: 0.9rem; bottom: 0.9rem; width: 4px; background: var(--tan); border-radius: 2px; }
  .rp-list li { position: relative; }
  .rp-list a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.55rem 0; color: var(--on-night); text-decoration: none; border-bottom: 1px solid var(--night-line); }
  .rp-list > li > a::before { content: ''; position: absolute; left: -1.55rem; top: 0.95rem; width: 12px; height: 12px; border-radius: 50%; background: var(--night); border: 3px solid var(--tan); }
  .rp-list li.is-home > a::before, .rp-list li.is-current > a::before { background: var(--tan); }
  .rp-list-name { font: 700 1.05rem var(--f-display); font-variation-settings: 'wdth' 108; }
  .rp-list .is-home > a .rp-list-name, .rp-list .is-current > a .rp-list-name { color: var(--tan); }
  .rp-list-elev { color: var(--on-night-soft); font-size: var(--t-sm); white-space: nowrap; }
  .rp-list-spur { list-style: none; margin: 0 0 0 1rem; padding: 0 0 0 1rem; border-left: 3px dotted var(--tan); }
}

/* ── Sections ── */
.section { padding: clamp(3rem, 6vw, 5rem) 0; }
.section + .section { padding-top: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.section-intro { max-width: 64ch; color: var(--ink-soft); }
.more { font-weight: 700; white-space: nowrap; }
.intro { padding-bottom: clamp(2.5rem, 5vw, 4rem); }
.lead { font-size: var(--t-md); line-height: 1.55; }
.also { color: var(--ink-soft); }

/* Service index: a list, not a card grid */
.svc-index { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: clamp(1.5rem, 4vw, 3.5rem); border-top: 3px solid var(--ink); }
.svc-index li { border-bottom: 1px solid var(--rule); }
.svc-index a { display: grid; gap: 0.25rem; padding: 1.15rem 0 1.15rem 1.1rem; text-decoration: none; color: var(--ink); position: relative; }
.svc-index a::before { content: ''; position: absolute; left: 0; top: 1.35rem; bottom: 1.3rem; width: 4px; background: var(--rule); border-radius: 2px; transition: background 0.15s; }
.svc-index a:hover::before, .svc-index a:focus-visible::before { background: var(--rust); }
.svc-name { font: 700 var(--t-md)/1.2 var(--f-display); font-variation-settings: 'wdth' 110; }
.svc-index a:hover .svc-name { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.15em; }
.svc-blurb { color: var(--ink-soft); }
.svc-cost { font-size: var(--t-sm); color: var(--rust-deep); font-weight: 700; }
@media (max-width: 720px) { .svc-index { grid-template-columns: 1fr; } }

/* PSPS band */
.band-psps { background: var(--paper-2); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: clamp(3rem, 6vw, 5rem) 0; }
.section + .band-psps { padding-top: clamp(3rem, 6vw, 5rem); }
.band-psps + .section { padding-top: clamp(3rem, 6vw, 5rem); }
.psps-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.psps-grid p { max-width: 54ch; }
.psps-list { list-style: none; margin: 0; padding: 0; }
.psps-list li { display: grid; gap: 0.2rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.psps-list li:first-child { padding-top: 0; }
.psps-list strong { font: 750 1.15rem var(--f-display); font-variation-settings: 'wdth' 110; }
.psps-list span { color: var(--ink-soft); }
@media (max-width: 820px) { .psps-grid { grid-template-columns: 1fr; } }

/* Utility table */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 3px solid var(--ink); }
.util-table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 1rem; }
.util-table caption { text-align: left; caption-side: bottom; font-size: var(--t-sm); color: var(--ink-soft); padding-top: 0.75rem; }
.util-table th, .util-table td { text-align: left; padding: 0.7rem 1rem 0.7rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.util-table thead th { font: 700 var(--t-sm) var(--f-body); color: var(--ink-soft); }
.util-table tbody th { font: 700 1.05rem var(--f-display); font-variation-settings: 'wdth' 108; white-space: nowrap; }
.util-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-right: 0; }
.util { display: inline-block; padding: 0.1rem 0.5rem; border-radius: var(--radius); font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
.util-pge { background: #E1E8F0; color: #1D3D5C; }
.util-smud { background: #DFEDE3; color: #1E4D2E; }
.util-roseville { background: #F1E1BA; color: #5C4508; }

/* Steps: a real sequence, so numbered */
.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.5rem; }
.steps li { counter-increment: step; position: relative; padding-top: 3.2rem; }
.steps li::before { content: counter(step); position: absolute; top: 0; left: 0; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 50%; background: var(--night); color: var(--tan); font: 400 1.1rem var(--f-slab); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--rust); }
.steps li::after { content: ''; position: absolute; top: 1.1rem; left: 2.8rem; right: -1rem; height: 3px; background: var(--rust); }
.steps li:last-child::after { display: none; }
.steps h3 { font-size: 1.15rem; }
.steps p { color: var(--ink-soft); font-size: 1rem; }
@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .steps li { padding: 0 0 1.25rem 3.4rem; }
  .steps li::after { top: 2.5rem; bottom: 0.2rem; left: 1.05rem; right: auto; width: 3px; height: auto; }
}

/* FAQ */
.faq-list { border-top: 3px solid var(--ink); }
.faq-list details { border-bottom: 1px solid var(--rule); }
.faq-list summary { list-style: none; cursor: pointer; padding: 1.1rem 2.5rem 1.1rem 0; position: relative; }
.faq-list summary::-webkit-details-marker { display: none; }
.faq-list summary h3 { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.faq-list summary::after { content: ''; position: absolute; right: 0.5rem; top: 1.45rem; width: 12px; height: 12px; border-right: 3px solid var(--night-2); border-bottom: 3px solid var(--night-2); transform: rotate(45deg); transition: transform 0.2s; }
.faq-list details[open] summary::after { transform: rotate(-135deg); top: 1.75rem; }
.faq-list details p { margin: 0 0 1.25rem; max-width: 64ch; }
@media (prefers-reduced-motion: reduce) { .faq-list summary::after { transition: none; } }
.faq-toc ul { list-style: none; padding: 0; margin: 0 0 3rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.faq-toc a { display: inline-block; padding: 0.35rem 0.75rem; border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); font-size: var(--t-sm); background: #fff; }
.faq-toc a:hover { border-color: var(--ink); }
.faq-group { margin-bottom: 3rem; scroll-margin-top: 90px; }
.faq-group h2 { font-size: var(--t-lg); }
.faq-more { margin-top: 0.75rem; font-weight: 700; }

/* Estimate */
.estimate { background: var(--night); color: var(--on-night); border-top: 7px solid var(--rust); box-shadow: inset 0 3px 0 var(--tan); }
.estimate h2 { color: var(--tan); }
.section + .estimate { padding-top: clamp(3rem, 6vw, 5rem); }
.estimate-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.estimate-copy p { color: var(--on-night-soft); max-width: 40ch; }
.estimate-phone { display: inline-block; font: 400 clamp(1.8rem, 1.2rem + 2vw, 2.6rem)/1.1 var(--f-slab); color: var(--tan); text-decoration: none; margin: 0.25rem 0 0.5rem; }
.estimate-phone:hover { color: var(--tan); text-decoration: underline; }
.estimate-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; }
.field { display: grid; gap: 0.35rem; }
.field-wide { grid-column: 1 / -1; }
.field label { font-weight: 700; font-size: 1rem; }
.opt { font-weight: 400; color: var(--on-night-soft); }
.field input, .field select, .field textarea {
  font: 400 1.05rem/1.4 var(--f-body); color: var(--ink); background: var(--paper);
  border: 2px solid transparent; border-radius: var(--radius); padding: 0.7rem 0.8rem; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--tan); }
.estimate-form .btn { justify-self: start; }
.hp { position: absolute; left: -9999px; }
@media (max-width: 820px) { .estimate-grid, .estimate-form { grid-template-columns: 1fr; } }

/* Service + city pages */
.svc-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.prose { max-width: var(--measure); }
.prose h2 { font-size: var(--t-lg); margin-top: 1.6em; }
.prose h2:first-child { margin-top: 0; }
.prose ul { padding-left: 1.2rem; }
.prose li { margin-bottom: 0.4rem; }
.svc-aside { display: grid; gap: 2rem; position: sticky; top: 96px; }
.cost-box { border-top: 6px solid var(--rust); background: #fff; padding: 1.4rem 1.5rem 1rem; }
.cost-box h2, .signs-box h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
.cost-range { font: 400 clamp(1.8rem, 1.3rem + 1.6vw, 2.4rem)/1.1 var(--f-slab); color: var(--rust-deep); margin-bottom: 0.5rem; }
.cost-fine { font-size: var(--t-sm); color: var(--ink-soft); }
.signs-box ul { list-style: none; padding: 0; margin: 0; }
.signs-box li { padding: 0.55rem 0 0.55rem 1.4rem; border-bottom: 1px solid var(--rule); position: relative; }
.signs-box li::before { content: ''; position: absolute; left: 0; top: 1.05rem; width: 10px; height: 3px; background: var(--rust); }
@media (max-width: 860px) { .svc-layout { grid-template-columns: 1fr; } .svc-aside { position: static; } }

.town-chips, .related { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.town-chips a, .related a { display: inline-block; padding: 0.5rem 0.85rem; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1rem; }
.town-chips a:hover, .related a:hover { border-color: var(--ink); }
.also-h { margin-top: 2.5rem; font-size: 1.15rem; }

.county-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2.5rem; }
.county-grid h2 { font-size: var(--t-lg); }
.county-list { list-style: none; padding: 0; margin: 0; border-top: 3px solid var(--ink); }
.county-list a { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); font-weight: 700; }
.county-list a:hover span:first-child { text-decoration: underline; }
.county-meta { font-weight: 400; color: var(--ink-soft); font-size: var(--t-sm); }

/* ── Footer ── */
.site-footer { background: var(--night-deep); color: #C9D2CC; padding: 3.5rem 0 6rem; font-size: 1rem; }
.site-footer a { color: #E7ECE8; }
.site-footer .logo { color: #fff; margin-bottom: 1rem; }
.site-footer .logo-elec { color: #A9B6AE; }
.footer-grid { display: grid; grid-template-columns: 1.3fr 1fr 1.4fr; gap: 2.5rem; }
.footer-h { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.8rem; }
.site-footer ul { list-style: none; margin: 0; padding: 0; }
.site-footer li { margin-bottom: 0.35rem; }
.footer-cols { columns: 2; column-gap: 1.5rem; }
.footer-phone { font: 400 1.4rem var(--f-slab); color: var(--tan) !important; text-decoration: none; }
.footer-small { font-size: var(--t-sm); color: #A9B6AE; }
.footer-base { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border-top: 1px solid #3A4A42; margin-top: 2.5rem; padding-top: 1.25rem; font-size: var(--t-sm); }
@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr; } }

/* Mobile call bar */
.callbar { display: none; }
@media (max-width: 760px) {
  .callbar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0.6rem var(--gutter) calc(0.6rem + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .callbar .btn { padding: 0.85em 0.5em; }
  .site-header .btn-call { display: none; }
  .js .site-nav.open .btn-call { display: inline-flex; }
}
