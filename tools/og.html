<html><head><!--FONTS--><style>/* Off 80 Electric
   Palette lifted from the Northern Spark badge: Sierra night sky, rust ring,
   tan lettering, snow on the peaks. Rust is the action color. */
:root {
  --paper: #F0EDE5;
  --paper-2: #E4DFD2;
  --ink: #1A2A2A;
  --ink-soft: #4B5957;
  --night: #16302F;
  --night-2: #1F403E;
  --night-deep: #0F2423;
  --night-line: #355856;
  --on-night: #F2EBDA;
  --on-night-soft: #AFBDB6;
  --tan: #E7CF97;
  --tan-deep: #C9A85C;
  --rust: #B9481F;
  --rust-deep: #973A16;
  --snow: #D8E3E2;
  --rule: #D5CEBF;
  --f-slab: 'Alfa Slab One', 'Rockwell', 'Roboto Slab', Georgia, serif;
  --f-display: 'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Type scale, ratio ~1.25 off an 18px base */
  --t-sm: 0.889rem;
  --t-base: 1.125rem;
  --t-md: 1.333rem;
  --t-lg: 1.666rem;
  --t-xl: clamp(1.9rem, 1.4rem + 1.6vw, 2.6rem);
  --t-xxl: clamp(2.6rem, 1.4rem + 4.6vw, 5.4rem);

  --gutter: clamp(1rem, 0.5rem + 2.5vw, 2.5rem);
  --measure: 68ch;
  --radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--t-base)/1.6 var(--f-body);
  font-variation-settings: 'wdth' 100;
  overflow-x: hidden;
}
img, svg { max-width: 100%; }
a { color: var(--rust-deep); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { color: var(--rust); text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-variation-settings: 'wdth' 112; line-height: 1.1; margin: 0 0 0.6em; letter-spacing: -0.01em; text-wrap: balance; }
h1, h2 { font-family: var(--f-slab); font-weight: 400; letter-spacing: 0; font-variation-settings: normal; }
h2 { font-size: var(--t-xl); line-height: 1.12; }
.section > .wrap > h2, .section-head h2 { color: var(--night); }
h3 { font-size: var(--t-md); font-weight: 700; }
p { margin: 0 0 1em; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); }
.wrap-wide { width: 100%; max-width: 1360px; margin: 0 auto; padding: 0 var(--gutter); }
.narrow { max-width: calc(var(--measure) + 2 * var(--gutter)); }
.skip { position: absolute; left: -999px; top: 0; background: var(--tan); color: var(--ink); padding: 0.6rem 1rem; z-index: 100; }
.skip:focus { left: 0.5rem; top: 0.5rem; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
  font: 700 1rem/1 var(--f-display); font-variation-settings: 'wdth' 105;
  padding: 0.85em 1.25em; border-radius: var(--radius); border: 2px solid transparent;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn-lg { font-size: 1.125rem; padding: 1em 1.4em; }
.btn-call { background: var(--rust); color: #fff; border-color: var(--rust); }
.btn-call:hover { background: var(--rust-deep); border-color: var(--rust-deep); color: #fff; text-decoration: none; }
.btn-ghost { color: var(--on-night); border-color: var(--on-night-soft); background: transparent; }
.btn-ghost:hover { border-color: var(--on-night); color: #fff; }
.btn-ghost-dark { color: var(--ink); border-color: var(--ink); background: var(--paper); }

/* ── Top bar + header ── */
.topbar { background: var(--night); color: var(--on-night-soft); font-size: var(--t-sm); }
.topbar-in { display: flex; justify-content: space-between; gap: 1rem; padding-top: 0.4rem; padding-bottom: 0.4rem; }
.site-header { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; }
.header-in { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 72px; }
.logo { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--ink); }
.logo:hover { color: var(--ink); }
.logo-mark { width: 48px; height: 48px; flex: none; }
.logo-word { display: flex; flex-direction: column; line-height: 0.95; text-transform: uppercase; }
.logo-off { font: 400 1.55rem/1 var(--f-slab); letter-spacing: 0.02em; }
.logo-elec { font: 700 0.74rem/1 var(--f-display); font-variation-settings: 'wdth' 125; letter-spacing: 0.3em; color: var(--rust); margin-top: 0.2rem; }
.footer-badge { width: 132px; height: 132px; display: block; margin-bottom: 1.25rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.header-in { position: relative; }
.site-nav { display: flex; align-items: center; gap: 1.5rem; align-self: stretch; }
.nav-list { list-style: none; display: flex; gap: 1.2rem; margin: 0; padding: 0; align-self: stretch; }
.nav-list > li { display: flex; align-items: center; }
.nav-top { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1rem; padding: 0.4rem 0; border-bottom: 2px solid transparent; }
.nav-top:hover, .nav-top[aria-current] { color: var(--ink); border-bottom-color: var(--rust); }
.sub-toggle { width: 22px; height: 30px; border: 0; background: none; cursor: pointer; padding: 0; margin-left: 1px; display: grid; place-items: center; color: var(--ink-soft); border-radius: 4px; }
.sub-toggle::before { content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; }
.has-menu.open .sub-toggle::before { transform: translateY(2px) rotate(-135deg); }
.nav-toggle { display: none; font: 700 1rem var(--f-display); background: none; border: 2px solid var(--ink); border-radius: var(--radius); padding: 0.5rem 0.9rem; color: var(--ink); min-height: 44px; }

/* Drop-down panels */
.mega-h { font: 700 0.9rem var(--f-body); color: var(--ink-soft); margin: 0 0 0.6rem; }
.mega-list, .mega-feat { list-style: none; margin: 0; padding: 0; }
.mega-list a, .mega-feat a, .mega-topic-h { display: flex; align-items: center; gap: 0.6rem; color: var(--ink); text-decoration: none; border-radius: 8px; }
.mega-list a { padding: 0.45rem 0.5rem; font-size: 0.98rem; }
.mega-list a:hover, .mega-feat a:hover, .mega-topic-h:hover { background: var(--paper-2); color: var(--ink); }
.mega-list.two { columns: 2; column-gap: 0.75rem; }
.mega-list.two li { break-inside: avoid; }
.mega-feat a { padding: 0.55rem 0.6rem; }
.mega-feat strong { display: block; font: 700 1.02rem var(--f-display); font-variation-settings: 'wdth' 106; }
.mega-sub { color: var(--rust-deep); font-size: 0.88rem; font-weight: 700; }
.mega-ic { width: 44px; height: 44px; flex: none; background: var(--paper-2); border-radius: 10px; padding: 6px; }
.mega-ic-s { width: 28px; height: 28px; flex: none; }
.mega-topic-h { font: 700 1rem var(--f-display); padding: 0.4rem 0.5rem; margin-bottom: 0.15rem; }
.mega-list.qs a { font-size: 0.92rem; color: var(--ink-soft); padding: 0.35rem 0.5rem 0.35rem 2.65rem; line-height: 1.35; }
.mega-foot { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin: 1rem 0 0; padding-top: 0.9rem; border-top: 1px solid var(--rule); font-weight: 700; }
.mega-foot a { color: var(--rust-deep); }

@media (min-width: 961px) {
  .mega { position: absolute; left: var(--gutter); right: var(--gutter); top: 100%; z-index: 70; padding-top: 0; visibility: hidden; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 0.14s ease, transform 0.14s ease, visibility 0s linear 0.14s; }
  .has-menu:hover .mega, .has-menu:focus-within .mega, .has-menu.open .mega { visibility: visible; opacity: 1; transform: none; pointer-events: auto; transition-delay: 0.06s, 0.06s, 0s; }
  .has-menu:hover .nav-top { border-bottom-color: var(--rust); }
  .mega-in { background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--rust); border-radius: 0 0 14px 14px; box-shadow: 0 22px 44px rgba(15, 36, 35, 0.18); padding: 1.4rem 1.6rem 1.2rem; }
  .mega-grid { display: grid; gap: 1.5rem 2rem; }
  .mega-svc { grid-template-columns: 1fr 1.6fr; }
  .mega-areas { grid-template-columns: 1.6fr 1fr 1fr 1fr; }
  .mega-guides { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .mega { transition: none !important; } }

/* Phone and tablet menu: a full-height panel with expandable sections */
@media (max-width: 960px) {
  .topbar-hours { display: none; }
  .js .nav-toggle { display: inline-block; }
  .js .site-nav { display: none; position: fixed; left: 0; right: 0; top: var(--hdr, 72px); bottom: 0; background: var(--paper); flex-direction: column; align-items: stretch; gap: 0; padding: 0.25rem var(--gutter) calc(6rem + env(safe-area-inset-bottom, 0px)); overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--rule); z-index: 65; }
  .js .site-nav.open { display: flex; }
  .nav-list { flex-direction: column; gap: 0; }
  .nav-list > li { flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
  .nav-top { flex: 1; display: block; padding: 0.95rem 0; font-size: 1.15rem; border-bottom: 0; }
  .nav-top[aria-current] { color: var(--rust-deep); }
  .sub-toggle { width: 48px; height: 48px; color: var(--ink); }
  .sub-toggle::before { width: 10px; height: 10px; border-width: 2.5px; }
  .mega { display: none; width: 100%; padding: 0 0 1rem; }
  .has-menu.open .mega { display: block; }
  .mega-grid { display: grid; gap: 1rem; }
  .mega-areas { grid-template-columns: 1fr 1fr; }
  .mega-areas > div:first-child { grid-column: 1 / -1; }
  .mega-list.two { columns: 2; }
  .mega-list a { padding: 0.6rem 0.5rem; min-height: 44px; }
  .mega-list.qs { display: none; }
  .mega-guides { grid-template-columns: 1fr 1fr; gap: 0.25rem; }
  .mega-topic-h { padding: 0.6rem 0.5rem; min-height: 44px; font-size: 0.98rem; }
  .mega-foot { margin-top: 0.5rem; }
  .mega-foot a { padding: 0.4rem 0; }
  .nav-phone { margin-top: 1.25rem; font-size: 1.2rem; min-height: 44px; }
  .site-nav .btn { margin-top: 0.75rem; min-height: 52px; }
  html.nav-open { overflow: hidden; }
}
@media (max-width: 960px) and (min-width: 600px) { .mega-svc { grid-template-columns: 1fr 1fr; } }

/* ── Breadcrumbs ── */
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.9rem 0 0; margin: 0; font-size: var(--t-sm); color: var(--ink-soft); }
.crumbs li + li::before { content: '/'; margin-right: 0.4rem; color: var(--rule); }
.crumbs a { color: var(--ink-soft); }
.crumbs + main .hero { margin-top: 0.9rem; }

/* ── Hero ── */
.hero { background: linear-gradient(180deg, var(--night-deep) 0%, var(--night) 70%); color: var(--on-night); border-bottom: 7px solid var(--rust); box-shadow: inset 0 -3px 0 var(--tan); padding: clamp(2.5rem, 6vw, 5rem) 0 clamp(2.5rem, 5vw, 4rem); position: relative; overflow: hidden; }
.hero a:not(.btn) { color: var(--tan); }
.hero-home { padding-bottom: 0; }
.hero-home .route-caption { padding-bottom: 2.5rem; }
.hero h1 { color: var(--on-night); }
.h1-big { display: block; font: 400 var(--t-xxl)/1 var(--f-slab); color: var(--tan); letter-spacing: 0.005em; max-width: 14ch; text-shadow: 0 2px 0 var(--night-deep); }
.h1-sub { display: block; margin-top: 1.1rem; font: 400 var(--t-md)/1.45 var(--f-body); font-variation-settings: 'wdth' 100; color: var(--on-night-soft); max-width: 46ch; letter-spacing: 0; }
.hero-inner h1 { font: 400 clamp(2.2rem, 1.3rem + 3.2vw, 4rem)/1.05 var(--f-slab); color: var(--tan); max-width: 20ch; margin-bottom: 0.5em; text-wrap: balance; }
.hero-answer { font-size: var(--t-md); line-height: 1.5; max-width: 60ch; color: var(--on-night); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.75rem; }
.hero-route { margin-top: clamp(2rem, 4vw, 3rem); }
.route-caption { color: var(--on-night-soft); max-width: 62ch; font-size: var(--t-sm); margin: 0.75rem 0 0; padding-left: calc(96 / 1200 * 100%); }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin: 2.25rem 0 0; border-top: 1px solid var(--night-line); }
.facts div { padding: 0.9rem 1rem 0.2rem 0; }
.facts dt { font-size: var(--t-sm); color: var(--on-night-soft); }
.facts dd { margin: 0.15rem 0 0; font: 700 1.1rem/1.3 var(--f-display); font-variation-settings: 'wdth' 110; }

/* ── Route profile: the signature element ── */
.route-profile { position: relative; }
.rp-svg { display: block; width: 100%; height: auto; overflow: visible; }
.rp-grid { stroke: var(--night-line); stroke-width: 1; stroke-dasharray: 2 6; }
.rp-axis { fill: var(--on-night-soft); font: 400 13px var(--f-body); font-variant-numeric: tabular-nums; }
.rp-stars { fill: var(--on-night); opacity: 0.55; }
.rp-far { fill: var(--night-2); }
.rp-snow { fill: var(--snow); opacity: 0.32; }
.rp-ground { fill: var(--night-deep); }
.rp-grid { opacity: 0.6; }
.rp-wire { fill: none; stroke: var(--tan); stroke-width: 5; stroke-linecap: round; }
.rp-spur { fill: none; stroke: var(--tan); stroke-width: 3; stroke-dasharray: 0.012 0.01; stroke-linecap: round; opacity: 0.85; }
.rp-road { fill: var(--on-night-soft); font: 700 13px var(--f-display); font-variation-settings: 'wdth' 125; letter-spacing: 0.06em; }
.rp-stop { cursor: pointer; text-decoration: none; }
.rp-dot { fill: var(--night); stroke: var(--tan); stroke-width: 3; transition: r 0.15s; }
.rp-halo { fill: none; stroke: var(--tan); stroke-width: 1.5; opacity: 0.6; }
.rp-name, .rp-elev, .rp-road { paint-order: stroke; stroke: var(--night-deep); stroke-width: 6px; stroke-linejoin: round; }
.rp-name { fill: var(--on-night); font: 700 16px var(--f-display); font-variation-settings: 'wdth' 108; }
.rp-elev { fill: var(--on-night-soft); font: 400 13px var(--f-body); }
.rp-stop.is-home .rp-dot { fill: var(--rust); stroke: var(--tan); }
.rp-stop.is-current .rp-dot { fill: var(--tan); }
.rp-halo { stroke: var(--rust); stroke-width: 2.5; opacity: 0.9; }
.rp-stop.is-home .rp-name { font-size: 19px; font-weight: 800; }
.rp-stop.is-current .rp-name { fill: var(--tan); }
.rp-stop:hover .rp-name, .rp-stop:focus-visible .rp-name { fill: var(--tan); text-decoration: underline; }
.rp-stop:hover .rp-dot { r: 9; }
.rp-stop:focus-visible { outline: none; }
.rp-stop:focus-visible .rp-dot { stroke: #fff; stroke-width: 4; }

/* One orchestrated load moment: the wire draws itself up the hill, stops light in order */
@media (prefers-reduced-motion: no-preference) {
  .rp-animate .rp-wire { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.55,.1,.3,1) 0.2s forwards; }
  .rp-animate .rp-spur { opacity: 0; animation: fadein 0.6s ease 1.6s forwards; }
  .rp-animate .rp-stop { opacity: 0; animation: fadein 0.35s ease forwards; animation-delay: calc(0.25s + var(--i) * 0.16s); }
  .rp-animate .rp-halo { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out 2s 2; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }

.rp-list { display: none; }
@media (max-width: 760px) {
  .rp-svg { display: none; }
  .route-caption { padding-left: 0; }
  .rp-list { display: block; list-style: none; margin: 0; padding: 0 0 0 1.75rem; position: relative; }
  .rp-list::before { content: ''; position: absolute; left: 0.55rem; top: 0.9rem; bottom: 0.9rem; width: 4px; background: var(--tan); border-radius: 2px; }
  .rp-list li { position: relative; }
  .rp-list a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 0.55rem 0; color: var(--on-night); text-decoration: none; border-bottom: 1px solid var(--night-line); }
  .rp-list > li > a::before { content: ''; position: absolute; left: -1.55rem; top: 0.95rem; width: 12px; height: 12px; border-radius: 50%; background: var(--night); border: 3px solid var(--tan); }
  .rp-list li.is-home > a::before, .rp-list li.is-current > a::before { background: var(--tan); }
  .rp-list-name { font: 700 1.05rem var(--f-display); font-variation-settings: 'wdth' 108; }
  .rp-list .is-home > a .rp-list-name, .rp-list .is-current > a .rp-list-name { color: var(--tan); }
  .rp-list-elev { color: var(--on-night-soft); font-size: var(--t-sm); white-space: nowrap; }
  .rp-list-spur { list-style: none; margin: 0 0 0 1rem; padding: 0 0 0 1rem; border-left: 3px dotted var(--tan); }
}

/* ── Sections ── */
.section { padding: clamp(3rem, 6vw, 5rem) 0; }
.section + .section { padding-top: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.section-intro { max-width: 64ch; color: var(--ink-soft); }
.more { font-weight: 700; white-space: nowrap; }
.intro { padding-bottom: clamp(2.5rem, 5vw, 4rem); }
.lead { font-size: var(--t-md); line-height: 1.55; }
.also { color: var(--ink-soft); }

/* Service index: a list, not a card grid */
.svc-index { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: clamp(1.5rem, 4vw, 3.5rem); border-top: 3px solid var(--ink); }
.svc-index li { border-bottom: 1px solid var(--rule); }
.svc-index a { display: grid; gap: 0.25rem; padding: 1.15rem 0 1.15rem 1.1rem; text-decoration: none; color: var(--ink); position: relative; }
.svc-index a::before { content: ''; position: absolute; left: 0; top: 1.35rem; bottom: 1.3rem; width: 4px; background: var(--rule); border-radius: 2px; transition: background 0.15s; }
.svc-index a:hover::before, .svc-index a:focus-visible::before { background: var(--rust); }
.svc-name { font: 700 var(--t-md)/1.2 var(--f-display); font-variation-settings: 'wdth' 110; }
.svc-index a:hover .svc-name { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.15em; }
.svc-blurb { color: var(--ink-soft); }
.svc-cost { font-size: var(--t-sm); color: var(--rust-deep); font-weight: 700; }
@media (max-width: 720px) { .svc-index { grid-template-columns: 1fr; } }

/* PSPS band */
.band-psps { background: var(--paper-2); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: clamp(3rem, 6vw, 5rem) 0; }
.section + .band-psps { padding-top: clamp(3rem, 6vw, 5rem); }
.band-psps + .section { padding-top: clamp(3rem, 6vw, 5rem); }
.psps-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.psps-grid p { max-width: 54ch; }
.psps-list { list-style: none; margin: 0; padding: 0; }
.psps-list li { display: grid; gap: 0.2rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); }
.psps-list li:first-child { padding-top: 0; }
.psps-list strong { font: 750 1.15rem var(--f-display); font-variation-settings: 'wdth' 110; }
.psps-list span { color: var(--ink-soft); }
@media (max-width: 820px) { .psps-grid { grid-template-columns: 1fr; } }

/* Utility table */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 3px solid var(--ink); }
.util-table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: 1rem; }
.util-table caption { text-align: left; caption-side: bottom; font-size: var(--t-sm); color: var(--ink-soft); padding-top: 0.75rem; }
.util-table th, .util-table td { text-align: left; padding: 0.7rem 1rem 0.7rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.util-table thead th { font: 700 var(--t-sm) var(--f-body); color: var(--ink-soft); }
.util-table tbody th { font: 700 1.05rem var(--f-display); font-variation-settings: 'wdth' 108; white-space: nowrap; }
.util-table .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-right: 0; }
.util { display: inline-block; padding: 0.1rem 0.5rem; border-radius: var(--radius); font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
.util-pge { background: #E1E8F0; color: #1D3D5C; }
.util-smud { background: #DFEDE3; color: #1E4D2E; }
.util-roseville { background: #F1E1BA; color: #5C4508; }

/* Steps: a real sequence, so numbered */
.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.5rem; }
.steps li { counter-increment: step; position: relative; padding-top: 3.2rem; }
.steps li::before { content: counter(step); position: absolute; top: 0; left: 0; width: 2.3rem; height: 2.3rem; display: grid; place-items: center; border-radius: 50%; background: var(--night); color: var(--tan); font: 400 1.1rem var(--f-slab); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--rust); }
.steps li::after { content: ''; position: absolute; top: 1.1rem; left: 2.8rem; right: -1rem; height: 3px; background: var(--rust); }
.steps li:last-child::after { display: none; }
.steps h3 { font-size: 1.15rem; }
.steps p { color: var(--ink-soft); font-size: 1rem; }
@media (max-width: 900px) {
  .steps { grid-template-columns: 1fr; gap: 0; }
  .steps li { padding: 0 0 1.25rem 3.4rem; }
  .steps li::after { top: 2.5rem; bottom: 0.2rem; left: 1.05rem; right: auto; width: 3px; height: auto; }
}

/* FAQ */
.faq-list { border-top: 3px solid var(--ink); }
.faq-list details { border-bottom: 1px solid var(--rule); }
.faq-list summary { list-style: none; cursor: pointer; padding: 1.1rem 2.5rem 1.1rem 0; position: relative; }
.faq-list summary::-webkit-details-marker { display: none; }
.faq-list summary h3 { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.35; }
.faq-list summary::after { content: ''; position: absolute; right: 0.5rem; top: 1.45rem; width: 12px; height: 12px; border-right: 3px solid var(--night-2); border-bottom: 3px solid var(--night-2); transform: rotate(45deg); transition: transform 0.2s; }
.faq-list details[open] summary::after { transform: rotate(-135deg); top: 1.75rem; }
.faq-list details p { margin: 0 0 1.25rem; max-width: 64ch; }
@media (prefers-reduced-motion: reduce) { .faq-list summary::after { transition: none; } }
.faq-toc ul { list-style: none; padding: 0; margin: 0 0 3rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.faq-toc a { display: inline-block; padding: 0.35rem 0.75rem; border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); font-size: var(--t-sm); background: #fff; }
.faq-toc a:hover { border-color: var(--ink); }
.faq-group { margin-bottom: 3rem; scroll-margin-top: 90px; }
.faq-group h2 { font-size: var(--t-lg); }
.faq-more { margin-top: 0.75rem; font-weight: 700; }

/* Estimate */
.estimate { background: var(--night); color: var(--on-night); border-top: 7px solid var(--rust); box-shadow: inset 0 3px 0 var(--tan); }
.estimate h2 { color: var(--tan); }
.section + .estimate { padding-top: clamp(3rem, 6vw, 5rem); }
.estimate-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.estimate-copy p { color: var(--on-night-soft); max-width: 40ch; }
.estimate-phone { display: inline-block; font: 400 clamp(1.8rem, 1.2rem + 2vw, 2.6rem)/1.1 var(--f-slab); color: var(--tan); text-decoration: none; margin: 0.25rem 0 0.5rem; }
.estimate-phone:hover { color: var(--tan); text-decoration: underline; }
.estimate-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.25rem; }
.field { display: grid; gap: 0.35rem; }
.field-wide { grid-column: 1 / -1; }
.field label { font-weight: 700; font-size: 1rem; }
.opt { font-weight: 400; color: var(--on-night-soft); }
.field input, .field select, .field textarea {
  font: 400 1.05rem/1.4 var(--f-body); color: var(--ink); background: var(--paper);
  border: 2px solid transparent; border-radius: var(--radius); padding: 0.7rem 0.8rem; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--tan); }
.estimate-form .btn { justify-self: start; }
.hp { position: absolute; left: -9999px; }
@media (max-width: 820px) { .estimate-grid, .estimate-form { grid-template-columns: 1fr; } }

/* Service + city pages */
.svc-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(2rem, 5vw, 4.5rem); align-items: start; }
.prose { max-width: var(--measure); }
.prose h2 { font-size: var(--t-lg); margin-top: 1.6em; }
.prose h2:first-child { margin-top: 0; }
.prose ul { padding-left: 1.2rem; }
.prose li { margin-bottom: 0.4rem; }
.svc-aside { display: grid; gap: 2rem; position: sticky; top: 96px; }
.cost-box { border-top: 6px solid var(--rust); background: #fff; padding: 1.4rem 1.5rem 1rem; }
.cost-box h2, .signs-box h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; }
.cost-range { font: 400 clamp(1.8rem, 1.3rem + 1.6vw, 2.4rem)/1.1 var(--f-slab); color: var(--rust-deep); margin-bottom: 0.5rem; }
.cost-fine { font-size: var(--t-sm); color: var(--ink-soft); }
.signs-box ul { list-style: none; padding: 0; margin: 0; }
.signs-box li { padding: 0.55rem 0 0.55rem 1.4rem; border-bottom: 1px solid var(--rule); position: relative; }
.signs-box li::before { content: ''; position: absolute; left: 0; top: 1.05rem; width: 10px; height: 3px; background: var(--rust); }
@media (max-width: 860px) { .svc-layout { grid-template-columns: 1fr; } .svc-aside { position: static; } }

.town-chips, .related { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.town-chips a, .related a { display: inline-block; padding: 0.5rem 0.85rem; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1rem; }
.town-chips a:hover, .related a:hover { border-color: var(--ink); }
.also-h { margin-top: 2.5rem; font-size: 1.15rem; }

.county-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2.5rem; }
.county-grid h2 { font-size: var(--t-lg); }
.county-list { list-style: none; padding: 0; margin: 0; border-top: 3px solid var(--ink); }
.county-list a { display: flex; justify-content: space-between; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); font-weight: 700; }
.county-list a:hover span:first-child { text-decoration: underline; }
.county-meta { font-weight: 400; color: var(--ink-soft); font-size: var(--t-sm); }

/* ── Footer ── */
.site-footer { background: var(--night-deep); color: #C9D2CC; padding: 3.5rem 0 6rem; font-size: 1rem; }
.site-footer a { color: #E7ECE8; }
.site-footer .logo { color: #fff; margin-bottom: 1rem; }
.site-footer .logo-elec { color: #A9B6AE; }
.footer-grid { display: grid; grid-template-columns: 1.3fr 1fr 1.4fr; gap: 2.5rem; }
.footer-h { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.8rem; }
.site-footer ul { list-style: none; margin: 0; padding: 0; }
.site-footer li { margin-bottom: 0.35rem; }
.footer-cols { columns: 2; column-gap: 1.5rem; }
.footer-phone { font: 400 1.4rem var(--f-slab); color: var(--tan) !important; text-decoration: none; }
.footer-small { font-size: var(--t-sm); color: #A9B6AE; }
.footer-base { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border-top: 1px solid #3A4A42; margin-top: 2.5rem; padding-top: 1.25rem; font-size: var(--t-sm); }
@media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr; } }

/* Mobile call bar */
.callbar { display: none; }
@media (max-width: 760px) {
  .callbar { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0.6rem var(--gutter) calc(0.6rem + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .callbar .btn { padding: 0.85em 0.5em; }
  .site-header .btn-call { display: none; }
  .js .site-nav.open .btn-call { display: inline-flex; }
}

/* ── Answer-first additions ── */
.byline { color: var(--on-night-soft); font-size: var(--t-sm); margin-top: -0.25rem; }
.glance { display: grid; gap: 0; margin: 0.75rem 0 0.5rem; border-top: 1px solid var(--rule); }
.glance div { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.75rem; padding: 0.55rem 0; border-bottom: 1px solid var(--rule); font-size: 1rem; }
.glance dt { color: var(--ink-soft); }
.glance dd { margin: 0; font-weight: 700; }
.cost-box .btn { margin: 0.25rem 0 0.75rem; }
.q-list { list-style: none; margin: 0; padding: 0; border-top: 3px solid var(--ink); }
.q-list li { border-bottom: 1px solid var(--rule); }
.q-list a { display: grid; gap: 0.3rem; padding: 1rem 0 1rem 1.1rem; text-decoration: none; color: var(--ink); position: relative; }
.q-list a::before { content: ''; position: absolute; left: 0; top: 1.2rem; bottom: 1.15rem; width: 4px; background: var(--rule); border-radius: 2px; }
.q-list a:hover::before, .q-list a:focus-visible::before { background: var(--rust); }
.q-q { font: 700 1.15rem/1.3 var(--f-display); font-variation-settings: 'wdth' 108; }
.q-list a:hover .q-q { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.15em; }
.q-a { color: var(--ink-soft); font-size: 1rem; }
.section-head + .section-intro { margin-top: -0.25rem; }
.price-table .price { font: 400 1.05rem var(--f-slab); color: var(--rust-deep); white-space: nowrap; }
.price-table td { font-size: 0.95rem; }
.glossary { margin: 0; border-top: 3px solid var(--ink); }
.glossary div { padding: 1rem 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 90px; }
.glossary dt { font: 700 1.15rem var(--f-display); font-variation-settings: 'wdth' 108; margin-bottom: 0.25rem; }
.glossary dd { margin: 0; color: var(--ink-soft); max-width: 64ch; }
.glossary div:target { background: var(--paper-2); }
.footer-grid { grid-template-columns: 1.3fr 1fr 1.4fr 1fr; }
@media (max-width: 1000px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .footer-grid { grid-template-columns: 1fr; } }

/* ── Illustrations ── */
.sprite * { fill: none; }
svg { --ic-line: var(--night); --ic-a: var(--tan); --ic-b: var(--rust); --ic-s: #FBF8F1; --ic-d: var(--night-2); }
.s { fill: var(--ic-s); } .a { fill: var(--ic-a); } .b { fill: var(--ic-b); } .d { fill: var(--ic-d); }
.l { stroke: var(--ic-line); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.br { stroke-width: 3.5; }
.medal { flex: none; width: clamp(150px, 16vw, 220px); aspect-ratio: 1; border-radius: 50%; background: var(--night-2); box-shadow: 0 0 0 6px var(--night), 0 0 0 10px var(--rust), 0 0 0 12px var(--tan); display: grid; place-items: center; }
.medal-ic { width: 58%; height: 58%; --ic-line: var(--night-deep); }
.hero-grid { display: flex; justify-content: space-between; align-items: center; gap: clamp(2rem, 6vw, 5rem); }
.hero-grid > div:first-child { min-width: 0; }
@media (max-width: 760px) {
  .hero-grid { flex-direction: column-reverse; align-items: flex-start; gap: 1.5rem; }
  .hero-grid .medal { width: 96px; box-shadow: 0 0 0 4px var(--night), 0 0 0 7px var(--rust); }
}
.band-psps .medal { width: 120px; margin-bottom: 1.5rem; box-shadow: 0 0 0 5px var(--paper-2), 0 0 0 9px var(--rust); }

/* Service tiles: picture first, so the list can be scanned by shape */
.svc-index a { grid-template-columns: 64px minmax(0, 1fr); gap: 1.1rem; align-items: start; padding: 1.25rem 0.5rem 1.25rem 0; }
.svc-index a::before { display: none; }
.svc-ic { width: 64px; height: 64px; border-radius: 14px; background: var(--paper-2); padding: 8px; transition: background 0.15s; }
.svc-index a:hover .svc-ic, .svc-index a:focus-visible .svc-ic { background: var(--tan); }
.svc-text { display: grid; gap: 0.25rem; min-width: 0; }

/* Guide question lists */
.q-list a { grid-template-columns: 40px minmax(0, 1fr); column-gap: 1rem; padding-left: 0; }
.q-list a::before { display: none; }
.q-ic { width: 40px; height: 40px; grid-row: span 2; margin-top: 2px; }
.topic-h { display: flex; align-items: center; gap: 0.75rem; }
.topic-ic { width: 52px; height: 52px; flex: none; }

/* Tick lists for signs and key facts */
.ticks { list-style: none; margin: 0; padding: 0; }
.ticks li { display: grid; grid-template-columns: 22px 1fr; gap: 0.7rem; align-items: start; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
.tick { width: 22px; height: 22px; margin-top: 3px; }
.signs-box li::before { display: none; }
.signs-box li { padding-left: 0; }

/* City fact strip */
.facts div { display: grid; grid-template-columns: 34px 1fr; column-gap: 0.6rem; align-items: center; }
.fact-ic { width: 34px; height: 34px; grid-row: span 2; --ic-line: var(--night-deep); }

/* Utility groups on the home page */
.util-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
.util-group { background: #fff; border-top: 6px solid var(--ug, var(--rust)); padding: 1.4rem 1.4rem 1.5rem; }
.util-g-pge { --ug: #2F5D8A; } .util-g-smud { --ug: #3C7A4A; } .util-g-roseville { --ug: var(--tan-deep); }
.util-group h3 { margin: 0.5rem 0 0.25rem; font-size: 1.3rem; }
.util-group p { color: var(--ink-soft); font-size: 1rem; }
.util-group .town-chips a { background: var(--paper); font-size: 0.95rem; padding: 0.4rem 0.7rem; }
.ug-ic { width: 44px; height: 44px; }
.more-line { margin-top: 1.25rem; font-weight: 700; }
@media (max-width: 860px) { .util-groups { grid-template-columns: 1fr; } }

/* Pricing table icons */
.price-svc { display: flex; align-items: center; gap: 0.75rem; white-space: normal; }
.row-ic { width: 36px; height: 36px; flex: none; }

/* On-this-page jump menu */
.toc { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; padding: 1.25rem 0 0; }
.toc-h { font-weight: 700; color: var(--ink-soft); font-size: 0.95rem; }
.toc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.toc a { display: inline-block; padding: 0.45rem 0.8rem; min-height: 40px; line-height: 1.5; border-radius: 999px; background: #fff; border: 1px solid var(--rule); color: var(--ink); text-decoration: none; font-size: 0.95rem; font-weight: 700; }
.toc a:hover { border-color: var(--rust); color: var(--rust-deep); }
.toc + .section, .wrap:has(> .toc) + .section { padding-top: clamp(2rem, 4vw, 3rem); }
[id] { scroll-margin-top: 96px; }

/* Reading comfort */
.prose p, .prose li { line-height: 1.72; }
.prose p { max-width: 64ch; }
.prose h2 { margin-top: 2em; padding-top: 0.2em; }
.hero-answer { line-height: 1.55; }
.faq-list details p { line-height: 1.7; }
.faq-list summary { min-height: 48px; }
.medal-ic { width: 66%; height: 66%; }
.quick { list-style: none; margin: 2rem 0 1.5rem; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.5rem; }
.quick li { display: grid; grid-template-columns: 44px 1fr; gap: 0.8rem; align-items: center; font-size: 1rem; line-height: 1.35; }
.quick strong { display: block; font: 700 1.1rem var(--f-display); font-variation-settings: 'wdth' 108; }
.quick-ic { width: 44px; height: 44px; }
@media (max-width: 520px) { .quick { grid-template-columns: 1fr; } }
.medal { height: clamp(150px, 16vw, 220px); }
.band-psps .medal { height: 120px; }
@media (max-width: 760px) { .hero-grid .medal { height: 96px; } }
@media (max-width: 860px) { .svc-layout .svc-aside { order: -1; } }

/* Most requested: three larger tiles */
.featured { list-style: none; margin: 0 0 1rem; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
.featured a { display: flex; flex-direction: column; gap: 0.6rem; height: 100%; padding: 1.75rem 1.5rem 1.5rem; background: var(--night); color: var(--on-night); text-decoration: none; border-bottom: 6px solid var(--rust); }
.featured a:hover, .featured a:focus-visible { background: var(--night-2); color: var(--on-night); }
.feat-medal { width: 92px; height: 92px; border-radius: 50%; background: var(--night-2); box-shadow: 0 0 0 3px var(--night), 0 0 0 6px var(--rust); display: grid; place-items: center; margin-bottom: 0.5rem; }
.featured a:hover .feat-medal { background: var(--night); }
.feat-ic { width: 62%; height: 62%; --ic-line: var(--night-deep); }
.feat-name { font: 400 1.5rem/1.15 var(--f-slab); color: var(--tan); }
.feat-blurb { color: var(--on-night-soft); font-size: 1rem; line-height: 1.55; flex: 1; }
.feat-cost { font-size: 1rem; color: var(--on-night-soft); }
.feat-cost strong { display: block; font: 400 1.35rem var(--f-slab); color: var(--on-night); }
.feat-go { font-weight: 700; color: var(--tan); text-decoration: underline; text-underline-offset: 0.2em; }
.spaced-h { margin-top: 3rem; }
.popular-tag { display: inline-flex; align-items: center; gap: 0.5rem; margin: 0 0 1rem; padding: 0.35rem 0.85rem 0.35rem 0.5rem; border-radius: 999px; background: var(--night-2); color: var(--tan); font-weight: 700; font-size: 0.95rem; }
.popular-tag .tick { width: 20px; height: 20px; margin: 0; }
@media (max-width: 900px) { .featured { grid-template-columns: 1fr; } .featured a { display: grid; grid-template-columns: 72px 1fr; column-gap: 1rem; } .feat-medal { width: 64px; height: 64px; grid-row: span 4; } }

/* ── Getting in touch ── */
.nav-phone { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap; }
.nav-phone:hover { color: var(--rust-deep); }
.nav-ic { width: 22px; height: 22px; }
.btn-ic { width: 20px; height: 20px; --ic-line: var(--night-deep); }
.bar-ic { width: 20px; height: 20px; --ic-a: #fff; --ic-line: var(--rust-deep); }
@media (max-width: 1100px) and (min-width: 961px) { .nav-phone { display: none; } }

.help-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.help-opt { display: grid; grid-template-columns: 56px 1fr 14px; gap: 1rem; align-items: center; padding: 0.75rem 0.9rem 0.75rem 0.75rem; border-radius: 12px; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--rule); min-height: 72px; }
.help-opt:hover, .help-opt:focus-visible { border-color: var(--rust); color: var(--ink); }
.help-ic { width: 56px; height: 56px; padding: 9px; border-radius: 12px; background: var(--paper-2); }
.help-text { display: grid; gap: 0.15rem; min-width: 0; }
.help-name { font: 700 1.15rem/1.25 var(--f-display); font-variation-settings: 'wdth' 106; }
.help-note { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.4; }
.help-chev { width: 18px; height: 18px; opacity: 0; }
.help-opt::after { content: ''; width: 10px; height: 10px; border-right: 2.5px solid var(--ink-soft); border-top: 2.5px solid var(--ink-soft); transform: rotate(45deg); grid-column: 3; grid-row: 1; justify-self: center; }
.help-emergency .help-ic { background: #F6DDD3; }
.help-emergency .help-name { color: var(--rust-deep); }

/* Tiles version at the bottom of every page */
.estimate .help-tiles { grid-template-columns: 1fr 1fr; gap: 0.9rem; }
.estimate .help-opt { background: var(--night-2); border-color: var(--night-line); color: var(--on-night); }
.estimate .help-opt:hover, .estimate .help-opt:focus-visible { border-color: var(--tan); background: #24494A; }
.estimate .help-note { color: var(--on-night-soft); }
.estimate .help-ic { background: var(--paper); }
.estimate .help-opt::after { border-color: var(--tan); }
.estimate .help-emergency .help-name { color: #F2A98C; }
@media (max-width: 640px) { .estimate .help-tiles { grid-template-columns: 1fr; } }
.help-light { gap: 0.75rem; }

/* The dialog itself */
.help { padding: 0; border: 0; border-radius: 18px; width: min(460px, calc(100vw - 32px)); max-height: min(88vh, 860px); background: var(--paper); color: var(--ink); box-shadow: 0 24px 60px rgba(15, 36, 35, 0.35); position: fixed; inset: auto max(20px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) auto; margin: 0; overflow: auto; }
.help::backdrop { background: rgba(15, 36, 35, 0.45); }
.help-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 0.5rem; padding: 1.1rem 1.1rem 0.9rem 1.4rem; background: var(--paper); border-bottom: 1px solid var(--rule); }
.help-title { font: 400 1.45rem/1.2 var(--f-slab); margin: 0; flex: 1; color: var(--night); }
.help-close, .help-back { font: 700 1rem var(--f-display); background: #fff; color: var(--ink); border: 2px solid var(--rule); border-radius: 10px; min-width: 44px; min-height: 44px; cursor: pointer; }
.help-back { padding: 0 0.8rem; }
.help-close:hover, .help-back:hover { border-color: var(--ink); }
.help [data-view] { padding: 1.1rem 1.3rem 1.4rem; }
.help-lede { color: var(--ink-soft); font-size: 1rem; margin-bottom: 1rem; }
@media (max-width: 760px) {
  .help { inset: auto 0 0 0; width: 100%; max-width: none; border-radius: 18px 18px 0 0; max-height: 90vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@media (prefers-reduced-motion: no-preference) {
  .help[open] { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* Forms (on light surfaces) */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1rem; }
.form .field label, .form legend { font-weight: 700; font-size: 1rem; color: var(--ink); }
.form .opt { color: var(--ink-soft); font-weight: 400; }
.form input:not([type=radio]):not([type=file]), .form select, .form textarea { font: 400 1.05rem/1.4 var(--f-body); color: var(--ink); background: #fff; border: 2px solid var(--rule); border-radius: 8px; padding: 0.7rem 0.8rem; width: 100%; min-height: 48px; }
.form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--rust); box-shadow: 0 0 0 3px rgba(185, 72, 31, 0.18); }
.form input[type=file] { font-size: 0.95rem; }
.form .btn { justify-self: stretch; min-height: 52px; font-size: 1.1rem; }
.pref { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; }
.pref legend { padding: 0; margin-bottom: 0.4rem; width: 100%; }
.pref label { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 400; min-height: 40px; }
.pref input { width: 20px; height: 20px; accent-color: var(--rust); }
@media (max-width: 520px) { .form { grid-template-columns: 1fr; } }
.help .form { grid-template-columns: 1fr; }

.em-steps { margin: 0 0 1.25rem; padding-left: 1.4rem; display: grid; gap: 0.75rem; }
.em-steps li { line-height: 1.5; padding-left: 0.25rem; }
.em-steps li::marker { font-weight: 700; color: var(--rust); }
.btn-emergency { width: 100%; background: var(--rust); color: #fff; border-color: var(--rust); font-size: 1.2rem; min-height: 56px; }
.btn-emergency:hover { background: var(--rust-deep); color: #fff; }

/* Floating launcher (desktop) */
.launcher { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 55; display: inline-flex; align-items: center; gap: 0.55rem; padding: 0.95rem 1.4rem 0.95rem 1rem; border-radius: 999px; border: 3px solid var(--tan); background: var(--night); color: var(--on-night); font: 700 1.1rem var(--f-display); font-variation-settings: 'wdth' 106; cursor: pointer; box-shadow: 0 10px 28px rgba(15, 36, 35, 0.35); }
.launcher:hover { background: var(--night-2); }
.launch-ic { width: 26px; height: 26px; }
.help-open .launcher { visibility: hidden; }
@media (max-width: 760px) { .launcher { display: none; } }
.callbar .btn { gap: 0.4rem; }

/* Mid-page call to action */
.cta-band { background: var(--tan); border-top: 1px solid var(--tan-deep); border-bottom: 1px solid var(--tan-deep); }
.cta-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem 2rem; padding-block: 1.6rem; }
.cta-in p { margin: 0; font: 400 clamp(1.2rem, 1rem + 0.8vw, 1.5rem)/1.3 var(--f-slab); color: var(--night); max-width: 34ch; }
.cta-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.cta-band .btn-ghost-dark { background: transparent; border-color: var(--night); color: var(--night); }
.cta-band + .section { padding-top: clamp(3rem, 6vw, 5rem); }
.section + .cta-band { margin-top: 0; }

.contact-form-wrap { display: grid; grid-template-columns: 1fr 1.4fr; gap: clamp(1.5rem, 5vw, 4rem); align-items: start; border-top: 3px solid var(--ink); padding-top: 2rem; }
@media (max-width: 820px) { .contact-form-wrap { grid-template-columns: 1fr; } }
.spam-note { margin: 0; font-size: 0.92rem; color: var(--ink-soft); line-height: 1.45; }
.spam-box { display: grid; grid-template-columns: 48px 1fr; gap: 1rem; align-items: start; background: #fff; border-left: 5px solid var(--night); padding: 1.1rem 1.25rem; margin: 0 0 1rem; }
.spam-box.urgent { border-left-color: var(--rust); }
.spam-box p { margin: 0; }
.spam-ic { width: 48px; height: 48px; }
.next-steps { margin-bottom: 2rem; }
.footer-badge { width: 150px; height: 150px; }
.about-badge { float: right; width: 220px; margin: 0 0 1rem 2rem; text-align: center; }
.about-badge img { width: 220px; height: 220px; display: block; }
.about-badge figcaption { font-size: 0.9rem; color: var(--ink-soft); margin-top: 0.5rem; }
@media (max-width: 600px) { .about-badge { float: none; margin: 0 auto 1.5rem; } }
.logo-badge { width: 58px; height: 58px; flex: none; display: block; }
@media (max-width: 760px) { .logo-badge { width: 50px; height: 50px; } }

/* ── Service area map ── */
.area-map { margin: 0; }
.area-map svg { display: block; width: 100%; height: auto; }
.map-bg { fill: var(--night); }
.map-ridge { fill: none; stroke: #3A605C; stroke-width: 1.2; opacity: 0.55; }
.map-region { fill: #7F9A93; font: italic 400 15px var(--f-body); letter-spacing: 0.04em; }
.map-region.small { font-size: 13px; }
.map-lake { fill: #2F5D6E; stroke: #487A8A; stroke-width: 1; stroke-linejoin: round; }
.map-water { fill: #8FB3BF; font: italic 400 13px var(--f-body); }
.map-road { fill: none; stroke: var(--tan); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.map-road.major { stroke-width: 5; opacity: 1; }
.map-road.minor { stroke-width: 2.2; opacity: 0.55; stroke-dasharray: 1 0; }
.map-shield rect { fill: var(--tan); stroke: var(--night); stroke-width: 2; }
.map-shield.i rect { fill: #F2EBDA; }
.map-shield text { fill: var(--night); font: 800 13px var(--f-display); }
.map-town { cursor: pointer; text-decoration: none; }
.map-dot { fill: #F2EBDA; stroke: var(--rust); stroke-width: 3; transition: r 0.15s; }
.map-name { fill: var(--on-night); font: 700 18px var(--f-display); font-variation-settings: 'wdth' 104; paint-order: stroke; stroke: var(--night); stroke-width: 5px; stroke-linejoin: round; }
.map-town.is-home .map-dot { fill: var(--rust); stroke: var(--tan); }
.map-town.is-current .map-dot { fill: var(--tan); stroke: var(--rust); }
.map-town.is-current .map-name { fill: var(--tan); font-size: 21px; }
.map-ring { fill: none; stroke: var(--tan); stroke-width: 2; opacity: 0.7; }
.map-town:hover .map-name, .map-town:focus-visible .map-name, .map-town.hl .map-name { fill: var(--tan); text-decoration: underline; }
.map-town:hover .map-dot, .map-town.hl .map-dot { r: 9; fill: var(--tan); }
.map-town:focus-visible { outline: none; }
.map-town:focus-visible .map-dot { stroke: #fff; stroke-width: 4; }
.map-note { font-size: 0.92rem; color: var(--ink-soft); margin: 0.6rem 0 0; }

.areas-layout { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.areas-map { position: sticky; top: 92px; }
.county { margin-bottom: 2.5rem; }
.county h2 { font-size: var(--t-lg); display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; border-bottom: 3px solid var(--ink); padding-bottom: 0.5rem; margin-bottom: 1rem; }
.county-count { font: 400 1rem var(--f-body); color: var(--ink-soft); }
.town-cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; }
.town-card { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; padding: 1rem 1.1rem 1.1rem; background: #fff; border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); text-decoration: none; }
.town-card:hover, .town-card:focus-visible { border-color: var(--rust); color: var(--ink); }
.town-card.is-home { border-color: var(--rust); border-width: 2px; }
.tc-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.tc-name { font: 400 1.3rem/1.15 var(--f-slab); color: var(--night); }
.town-card:hover .tc-name { color: var(--rust-deep); }
.tc-tag { font-size: 0.8rem; font-weight: 700; color: #fff; background: var(--rust); padding: 0.15rem 0.55rem; border-radius: 999px; white-space: nowrap; }
.tc-blurb { font-size: 0.95rem; line-height: 1.5; color: var(--ink-soft); flex: 1; }
.tc-meta .util { font-size: 0.85rem; }
.tc-svcs { display: flex; flex-wrap: wrap; gap: 0.35rem 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--rule); font-size: 0.88rem; font-weight: 700; }
.tc-svcs span { display: inline-flex; align-items: center; gap: 0.3rem; }
.tc-ic { width: 22px; height: 22px; }
.not-listed { display: grid; grid-template-columns: 44px 1fr auto; gap: 1rem; align-items: center; background: var(--paper-2); border-radius: 12px; padding: 1.1rem 1.25rem; }
.not-listed p { margin: 0; }
.nl-ic { width: 44px; height: 44px; }
@media (max-width: 1100px) { .town-cards { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .areas-layout { grid-template-columns: 1fr; }
  .areas-map { position: static; max-width: 520px; margin: 0 auto; width: 100%; }
  .town-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .town-cards { grid-template-columns: 1fr; }
  .not-listed { grid-template-columns: 44px 1fr; }
  .not-listed .btn { grid-column: 1 / -1; }
}

/* City page hero with map */
.city-hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(2rem, 5vw, 4rem); align-items: start; }
.city-map { max-width: 400px; width: 100%; justify-self: end; }
.city-map .map-bg { fill: var(--night-2); }
.facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) {
  .city-hero { grid-template-columns: 1fr; }
  .city-map { justify-self: start; max-width: 460px; }
}

/* ── Mobile polish ── */
@media (max-width: 760px) {
  .topbar { font-size: 0.8rem; }
  .hero-inner h1 { font-size: clamp(1.85rem, 1.2rem + 3.4vw, 2.6rem); }
  .hero-answer { font-size: 1.12rem; }
  .hero-actions { gap: 0.6rem; }
  .hero-actions .btn { flex: 1 1 200px; }
  .toc { flex-direction: column; align-items: stretch; gap: 0.5rem; }
  .toc ul { flex-wrap: nowrap; overflow-x: auto; margin-right: calc(-1 * var(--gutter)); padding-right: var(--gutter); padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .toc ul::-webkit-scrollbar { display: none; }
  .toc li { flex: none; }
  .cta-actions { width: 100%; }
  .cta-actions .btn { flex: 1 1 160px; }
  .crumbs ol { flex-wrap: nowrap; }
  .crumbs li { white-space: nowrap; }
  .crumbs li[aria-current] { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .site-footer li a { display: inline-block; padding: 0.3rem 0; }
  .section-head { flex-wrap: wrap; }
  .facts dd { font-size: 1rem; }
  .featured a { padding: 1.25rem; }
  .svc-ic { width: 52px; height: 52px; }
  .svc-index a { grid-template-columns: 52px minmax(0, 1fr); }
  .quick { margin-top: 1.5rem; }
  .spam-box { grid-template-columns: 36px 1fr; }
  .spam-ic { width: 36px; height: 36px; }
}
/* Pricing table becomes stacked cards on phones */
@media (max-width: 700px) {
  .price-table { min-width: 0; }
  .price-table thead { display: none; }
  .price-table, .price-table tbody, .price-table tr, .price-table th, .price-table td { display: block; width: 100%; }
  .price-table tr { background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.8rem; }
  .price-table th, .price-table td { border: 0; padding: 0.25rem 0; text-align: left; }
  .price-table td::before { content: attr(data-label); display: block; font: 700 0.8rem var(--f-body); color: var(--ink-soft); margin-top: 0.4rem; }
  .price-table td.price { white-space: normal; }
  .table-scroll:has(.price-table) { border-top: 0; overflow: visible; }
}
@media (max-width: 380px) {
  .logo-off { font-size: 1.3rem; }
  .logo-elec { font-size: 0.66rem; }
  .logo-badge { width: 44px; height: 44px; }
  .nav-toggle { padding: 0.45rem 0.7rem; }
}
@media (min-width: 961px) { .has-menu.suppress .mega { visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; } }
.nav-top { white-space: nowrap; }
@media (min-width: 961px) and (max-width: 1260px) { .nav-phone { display: none; } .nav-list { gap: 1rem; } }
.map-ridge { opacity: 0.3; }
.fact-ic { --ic-line: var(--on-night-soft); }
@media (max-width: 700px) { .price-table caption { display: block; width: 100%; padding: 0 0 1rem; caption-side: top; } }
@media (max-width: 600px) { .mega-svc .mega-list.two { columns: 1; } }
@media (max-width: 760px) { .toc { flex-wrap: nowrap; } .toc ul { min-width: 0; } }
@media (max-width: 760px) { .hero-grid .medal { width: 72px; height: 72px; box-shadow: 0 0 0 3px var(--night), 0 0 0 6px var(--rust); } }

/* Hero: towns off the main route */
.also-serving { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 0.9rem; padding: 0 0 2.5rem calc(96 / 1200 * 100%); margin-top: 0.9rem; }
.also-h { font-weight: 700; color: var(--tan); font-size: 0.98rem; }
.also-serving ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.also-serving a { display: inline-block; padding: 0.4rem 0.85rem; border: 1.5px solid var(--night-line); border-radius: 999px; color: var(--on-night) !important; text-decoration: none; font-weight: 700; font-size: 0.95rem; background: rgba(15, 36, 35, 0.6); }
.also-serving a:hover { border-color: var(--tan); color: var(--tan) !important; }
.hero-home .route-caption { padding-bottom: 0; }
@media (max-width: 760px) { .also-serving { padding-left: 0; flex-direction: column; align-items: flex-start; } .also-serving a { padding: 0.55rem 0.9rem; } }
.route-caption, .also-serving { position: relative; z-index: 1; }
/* Focus ring: rust on light grounds, tan on the dark night bands (rust is under 3:1 there) */
.hero :focus-visible, .estimate :focus-visible, .site-footer :focus-visible, .topbar :focus-visible, .featured :focus-visible, .area-map :focus-visible { outline-color: var(--tan); }

/* Hero: the towns off the main route sit beside the headline, on the first screen */
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: clamp(2rem, 4vw, 4rem); align-items: end; }
.hero-top .also-serving { display: block; padding: 1.25rem 1.25rem 1.1rem; margin: 0; background: rgba(15, 36, 35, 0.55); border: 1px solid var(--night-line); border-radius: 12px; }
.hero-top .also-h { display: block; font: 400 1.25rem/1.2 var(--f-slab); color: var(--tan); margin: 0 0 0.8rem; }
.hero-top .also-serving ul { gap: 0.45rem; }
.hero-top .also-serving a { padding: 0.35rem 0.75rem; font-size: 0.92rem; }
.also-all { display: inline-block; margin-top: 0.9rem; font-weight: 700; font-size: 0.95rem; color: var(--tan) !important; }
.hero-home .route-caption { padding-bottom: 2.5rem; }
@media (max-width: 1080px) {
  .hero-top { grid-template-columns: 1fr; align-items: start; }
  .hero-top .also-serving { max-width: 640px; }
}
@media (max-width: 760px) {
  .hero-top { gap: 1.75rem; }
  .hero-top .also-serving { padding: 1rem; }
  .hero-top .also-serving a { padding: 0.45rem 0.8rem; font-size: 0.95rem; }
}
@media (min-width: 1081px) {
  .hero-top .h1-big { font-size: clamp(3.4rem, 1.2rem + 3.9vw, 4.5rem); max-width: none; white-space: nowrap; }

}
.hero-top .also-serving a.also-all { display: inline-block; border: 0; background: none; padding: 0.3rem 0; font-size: 0.95rem; text-decoration: underline; text-underline-offset: 0.2em; }
